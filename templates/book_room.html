{% extends "base.html" %}

{% block content %}
<div class="animate" style="max-width: 600px; margin: 4rem auto;">
    <div class="card card-purple">
        <h1 style="color: var(--vibrant-purple); font-weight: 800; margin-bottom: 2rem; text-align: center;">
            Book Your Stay 🌈</h1>

        <div
            style="background: #fdf5ff; padding: 1.5rem; border-radius: 20px; margin-bottom: 2rem; border-left: 5px solid var(--vibrant-purple);">
            <p style="font-weight: 700; color: var(--vibrant-purple);">Room Details:</p>
            <div style="display: flex; justify-content: space-between; margin-top: 10px;">
                <span>Room Number:</span>
                <span style="font-weight: 700;">{{ room.room_number }}</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 5px;">
                <span>Type:</span>
                <span style="font-weight: 700;">{{ room.type }}</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-top: 5px;">
                <span>Price:</span>
                <span style="font-weight: 700; color: var(--vibrant-purple);">₹{{ room.price_per_month }}/mo</span>
            </div>
        </div>

        <form action="/book/{{ room.id }}" method="POST">
            <div class="form-group">
                <label style="color: var(--vibrant-purple);">Move-in Date 📅</label>
                <input type="date" name="start_date" required>
            </div>
            <div class="form-group" style="margin-bottom: 2.5rem;">
                <label style="color: var(--vibrant-purple);">Stay Duration (Months) ⏳</label>
                <select name="duration">
                    <option value="1">1 Month</option>
                    <option value="3">3 Months</option>
                    <option value="6">6 Months</option>
                    <option value="12">1 Year</option>
                </select>
            </div>
            <button type="submit" class="btn bg-purple"
                style="width: 100%; border-radius: 15px; text-transform:none;">Confirm Booking ✨</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem;"><a href="/" style="color: #888; text-decoration: none;">Maybe
                later? Browse more 🔍</a></p>
    </div>
</div>
{% endblock %}
