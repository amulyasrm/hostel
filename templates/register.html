{% extends "base.html" %}

{% block content %}
<div class="animate" style="max-width: 500px; margin: 4rem auto;">
    <div class="card card-pink" style="text-align: center;">
        <h1 style="color: var(--vibrant-pink); font-weight: 800; margin-bottom: 2rem;">Join PG Queen 🌈</h1>
        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Aurora Princess" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="queen@example.com" required>
            </div>
            <div class="form-group" style="margin-bottom: 2rem;">
                <label>Choose Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn bg-pink"
                style="width: 100%; border-radius: 15px; text-transform:none;">Create Account ✨</button>
        </form>
        <p style="margin-top: 2rem; color: #888;">Already have an account? <a href="{{ url_for('login') }}"
                style="color: var(--vibrant-pink); font-weight: 600;">Login here 💖</a></p>
    </div>
</div>
{% endblock %}
